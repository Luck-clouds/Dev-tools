<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文件共享</title>
  <style>
    :root {
      --blue-700: #1f5eff;
      --blue-600: #2f72ff;
      --blue-100: #e9f1ff;
      --blue-050: #f5f9ff;
      --text: #17324d;
      --muted: #6f8ba8;
      --line: #d7e6ff;
      --danger: #ff5a76;
      --shadow: 0 12px 30px rgba(17, 62, 126, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(rgba(245, 249, 255, 0.9), rgba(245, 249, 255, 0.92)),
        url('/bg.png') center / cover no-repeat fixed;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .top {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .addr {
      color: var(--muted);
      font-size: 12px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--blue-050);
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 12px;
      min-height: calc(100vh - 94px);
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .head h2 {
      margin: 0;
      font-size: 16px;
    }

    .count {
      font-size: 12px;
      color: var(--muted);
    }

    .list {
      padding: 10px;
      max-height: calc(100vh - 170px);
      overflow: auto;
      background: var(--blue-050);
    }

    .file {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .name {
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-all;
      line-height: 1.3;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform .14s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.primary {
      color: #fff;
      background: linear-gradient(120deg, var(--blue-700), var(--blue-600));
    }

    .btn.soft {
      color: var(--text);
      background: var(--blue-100);
      border: 1px solid var(--line);
    }

    .btn.danger {
      color: #fff;
      background: linear-gradient(120deg, #ff8095, var(--danger));
    }

    .work {
      padding: 16px;
      display: grid;
      align-content: start;
      gap: 12px;
      background: var(--blue-050);
    }

    .drop {
      border: 2px dashed #bad2ff;
      border-radius: 12px;
      padding: 28px 12px;
      text-align: center;
      background: #fff;
      transition: .16s;
    }

    .drop.drag {
      border-color: var(--blue-700);
      background: #edf4ff;
    }

    .drop h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .drop p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #statusText {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 26px 8px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: #fff;
      margin: 8px;
    }

    input[type='file'] {
      display: none;
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .list {
        max-height: 360px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="title">文件共享</div>
      <div id="serverInfo" class="addr">连接中...</div>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="head">
          <h2>文件记录</h2>
          <span id="countChip" class="count">0 个</span>
        </div>
        <div id="fileList" class="list">
          <div class="empty">加载中...</div>
        </div>
      </aside>

      <main class="panel work">
        <div id="dropZone" class="drop">
          <h3>拖拽上传</h3>
          <p>支持多文件</p>
          <div class="actions">
            <label class="btn primary" for="picker">选择文件</label>
            <label class="btn soft" for="folderPicker">选择文件夹</label>
            <button id="refreshBtn" class="btn soft" type="button">刷新</button>
          </div>
          <input id="picker" type="file" multiple />
          <input id="folderPicker" type="file" webkitdirectory directory multiple />
        </div>
        <div id="statusText"></div>
      </main>
    </section>
  </div>

  <script>
    const picker = document.getElementById('picker');
    const folderPicker = document.getElementById('folderPicker');
    const dropZone = document.getElementById('dropZone');
    const statusText = document.getElementById('statusText');
    const fileList = document.getElementById('fileList');
    const countChip = document.getElementById('countChip');
    const refreshBtn = document.getElementById('refreshBtn');
    const serverInfo = document.getElementById('serverInfo');

    function setStatus(text, isError = false) {
      statusText.textContent = text || '';
      statusText.style.color = isError ? '#e04a66' : 'var(--muted)';
    }

    function fmtTime(iso) {
      return new Date(iso).toLocaleString();
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function loadFiles() {
      try {
        const resp = await fetch('/api/files');
        const data = await resp.json();
        if (!data.ok) throw new Error(data.message || '读取失败');

        const files = data.files || [];
        countChip.textContent = `${files.length} 个`;

        if (files.length === 0) {
          fileList.innerHTML = '<div class="empty">暂无文件</div>';
          return;
        }

        fileList.innerHTML = files.map((f) => `
          <article class="file">
            <div class="name">${escapeHtml(f.name)}</div>
            <div class="meta">
              <span>${f.sizeText}</span>
              <span>${fmtTime(f.updatedAt)}</span>
            </div>
            <div class="row">
              <a class="btn soft" href="${f.downloadUrl}">下载</a>
              <button class="btn danger" type="button" onclick="removeFile('${encodeURIComponent(f.name)}')">删除</button>
            </div>
          </article>
        `).join('');
      } catch (err) {
        fileList.innerHTML = `<div class="empty" style="color:#e04a66;">加载失败：${escapeHtml(err.message)}</div>`;
      }
    }

    function displayNameOf(file) {
      return file.relativePath || file.webkitRelativePath || file.name;
    }

    function uploadFile(file) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload');
        xhr.setRequestHeader('x-file-name', encodeURIComponent(file.name));
        if (file.relativePath) {
          xhr.setRequestHeader('x-file-relative-path', encodeURIComponent(file.relativePath));
        }

        xhr.upload.onprogress = (e) => {
          if (!e.lengthComputable) return;
          const p = Math.round((e.loaded / e.total) * 100);
          setStatus(`上传中：${displayNameOf(file)} (${p}%)`);
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve();
            return;
          }
          try {
            const data = JSON.parse(xhr.responseText || '{}');
            reject(new Error(data.message || `上传失败(${xhr.status})`));
          } catch {
            reject(new Error(`上传失败(${xhr.status})`));
          }
        };

        xhr.onerror = () => reject(new Error('网络错误'));
        xhr.send(file);
      });
    }

    async function uploadFiles(fileListObj) {
      const files = Array.from(fileListObj || []);
      if (files.length === 0) return;

      for (const f of files) {
        try {
          await uploadFile(f);
          setStatus(`上传成功：${displayNameOf(f)}`);
        } catch (err) {
          setStatus(`上传失败：${displayNameOf(f)}，${err.message}`, true);
        }
      }

      await loadFiles();
    }

    async function filesFromDataTransferItem(item, prefix = '') {
      if (!item) return [];

      if (item.kind === 'file' && typeof item.getAsFile === 'function' && !item.webkitGetAsEntry) {
        const file = item.getAsFile();
        if (!file) return [];
        file.relativePath = prefix ? `${prefix}/${file.name}` : file.name;
        return [file];
      }

      if (typeof item.webkitGetAsEntry !== 'function') return [];

      const entry = item.webkitGetAsEntry();
      if (!entry) return [];
      return filesFromEntry(entry, prefix);
    }

    async function filesFromEntry(entry, prefix = '') {
      if (entry.isFile) {
        const file = await new Promise((resolve, reject) => {
          entry.file(resolve, reject);
        });
        file.relativePath = prefix ? `${prefix}/${file.name}` : file.name;
        return [file];
      }

      if (!entry.isDirectory) return [];

      const nextPrefix = prefix ? `${prefix}/${entry.name}` : entry.name;
      const reader = entry.createReader();
      const entries = await new Promise((resolve, reject) => {
        const all = [];

        function readBatch() {
          reader.readEntries((batch) => {
            if (!batch.length) {
              resolve(all);
              return;
            }
            all.push(...batch);
            readBatch();
          }, reject);
        }

        readBatch();
      });

      const files = [];
      for (const child of entries) {
        files.push(...await filesFromEntry(child, nextPrefix));
      }
      return files;
    }

    async function filesFromDropEvent(event) {
      const dataTransfer = event.dataTransfer;
      if (!dataTransfer) return [];

      if (dataTransfer.items && dataTransfer.items.length > 0) {
        const files = [];
        for (const item of Array.from(dataTransfer.items)) {
          files.push(...await filesFromDataTransferItem(item));
        }
        if (files.length > 0) return files;
      }

      return Array.from(dataTransfer.files || []).map((file) => {
        file.relativePath = file.name;
        return file;
      });
    }

    async function removeFile(encodedName) {
      if (!confirm('确定删除这个文件吗？')) return;

      try {
        const resp = await fetch(`/api/file?name=${encodedName}`, { method: 'DELETE' });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.message || '删除失败');
        setStatus('删除成功');
        await loadFiles();
      } catch (err) {
        setStatus(`删除失败：${err.message}`, true);
      }
    }

    window.removeFile = removeFile;

    picker.addEventListener('change', () => uploadFiles(Array.from(picker.files || []).map((file) => {
      file.relativePath = file.name;
      return file;
    })));
    folderPicker.addEventListener('change', () => uploadFiles(Array.from(folderPicker.files || []).map((file) => {
      file.relativePath = file.webkitRelativePath || file.name;
      return file;
    })));
    refreshBtn.addEventListener('click', () => loadFiles());

    ['dragenter', 'dragover'].forEach((evt) => {
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('drag');
      });
    });

    ['dragleave', 'drop'].forEach((evt) => {
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('drag');
      });
    });

    dropZone.addEventListener('drop', async (e) => {
      const files = await filesFromDropEvent(e);
      uploadFiles(files);
    });

    serverInfo.textContent = location.origin;
    loadFiles();
  </script>
</body>

</html>
